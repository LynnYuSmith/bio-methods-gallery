[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dffbaseline"
version = "0.1.0"
description = "A rolling median baseline that lets dF/F sit symmetric around zero, vs a lower-envelope baseline."
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "gallery-style"]

[tool.setuptools.packages.find]
include = ["dffbaseline*"]
