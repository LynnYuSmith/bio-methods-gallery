[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceqc"
version = "0.1.0"
description = "Per-trace calcium QC: MAD-based SNR (+A-F grade) and an exponential photobleaching fit."
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "gallery-style"]

[tool.setuptools.packages.find]
include = ["traceqc*"]
