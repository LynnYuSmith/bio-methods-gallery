name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tiles:
    name: tiles (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # the union of what the tiles declare; each tile stays importable from its own directory
          pip install numpy scipy scikit-image h5py matplotlib tifffile pandas pytest
          pip install -e ./gallery_style

      - name: Run every tile's tests
        run: ./run_tests.sh
        env:
          PYTHON: python
          MPLBACKEND: Agg
